<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avitrack - Soporte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-bottom: 50px;
            font-weight: 400;
        }

        .button {
            display: block;
            width: 100%;
            padding: 20px 30px;
            margin-bottom: 20px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .button:hover {
            background-color: #1faa55;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background-color: #3498db;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .button-secondary:hover {
            background-color: #2980b9;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                padding: 18px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avitrack</h1>
        <p class="subtitle">Portal de Gestión de Privacidad y Datos</p>
        
        <a href="https://wa.me/573176952440?text=Deseo%20eliminar%20mi%20cuenta%20de%20Avitrack%20y%20toda%20mi%20información." class="button" id="btnA">
            Solicitar eliminación de mi cuenta
        </a>
        
        <a href="https://wa.me/573176952440?text=Deseo%20que%20eliminen%20mis%20registros%20de%20datos%20agrícolas%20pero%20mantener%20mi%20cuenta." class="button button-secondary" id="btnB">
            Solicitar eliminación de datos específicos
        </a>
    </div>
</body>
</html>
